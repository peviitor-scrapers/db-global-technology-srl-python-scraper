name: scrape

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Dry run (default)
        if: vars.PEVIITOR_UPLOAD_ENABLED != 'true'
        run: python3 scraper.py
      - name: Scrape and upload (opt-in via repo variable PEVIITOR_UPLOAD_ENABLED=true)
        if: vars.PEVIITOR_UPLOAD_ENABLED == 'true'
        run: python3 scraper.py --upload
